   spring.application.name=uniflow
   server.port=${SERVER_PORT:8080}

   spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniflow}
   spring.datasource.username=${DB_USERNAME:uniflow}
   spring.datasource.password=${DB_PASSWORD}

   # --- JPA : Hibernate se contente de VALIDER le schéma, Flyway en assure la gestion ---      spring.jpa.hibernate.ddl-auto=validate
   spring.jpa.open-in-view=false
   spring.jpa.properties.hibernate.format_sql=true


   # --- Flyway : exécute automatiquement les migrations au démarrage ---   spring.flyway.enabled=true
   spring.flyway.locations=classpath:db/migration

   management.endpoints.web.exposure.include=health,info
   management.endpoint.health.probes.enabled=true