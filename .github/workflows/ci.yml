name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Base PostgreSQL jetable, utilisée uniquement pendant les tests de la CI.
    # Les valeurs viennent de Settings > Secrets and variables > Actions :
    #   Variables : DB_NAME, DB_USERNAME
    #   Secrets   : DB_PASSWORD
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ vars.DB_NAME }}
          POSTGRES_USER: ${{ vars.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ vars.DB_USERNAME }} -d ${{ vars.DB_NAME }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/${{ vars.DB_NAME }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet, nécessaire à SonarQube

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Rendre le Maven Wrapper exécutable
        run: chmod +x mvnw

      - name: Compiler et exécuter les tests
        run: ./mvnw -B verify

      # Variables : SONAR_ORGANIZATION, SONAR_PROJECT_KEY — Secret : SONAR_TOKEN
      - name: Analyse SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérifier le formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires (Vitest)
        run: npm test -- --watch=false

      - name: Build de production
        run: npm run build